plugins { id 'com.android.application' }
android {
    namespace 'com.universalbuild.smoketest'
    compileSdk 36
    defaultConfig {
        applicationId 'com.universalbuild.smoketest'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        universalRelease {
            def keystore = System.getenv('UNIVERSAL_STORE_FILE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('UNIVERSAL_STORE_PASSWORD')
                keyAlias System.getenv('UNIVERSAL_KEY_ALIAS')
                keyPassword System.getenv('UNIVERSAL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('UNIVERSAL_STORE_FILE')) {
                signingConfig signingConfigs.universalRelease
            }
        }
    }
}
