name: Universal Build - Smoke Android real
on:
  push:
    branches:
      - main
      - implementation/**
    paths:
      - "samples/android-native/**"
      - "scripts/detect.sh"
      - "scripts/build.sh"
      - ".github/workflows/smoke-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Instalar Android SDK 36
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compilar APK nativo real
        env:
          UB_PROJECT_DIR: samples/android-native
          UB_KIND: android
          UB_TARGET: apk
          UB_MODULE: app
        run: |
          set -euo pipefail
          [[ "$(bash scripts/detect.sh samples/android-native)" == android ]]
          bash scripts/build.sh
      - name: Gerar AAB release com chave efêmera de laboratório
        env:
          UB_PROJECT_DIR: samples/android-native
          UB_KIND: android
          UB_TARGET: aab
          UB_MODULE: app
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 7 \
            -alias smoke -keystore "$RUNNER_TEMP/smoke.jks" \
            -storepass "SmokePass2026!" -keypass "SmokePass2026!" \
            -dname "CN=Universal Build Smoke, O=Tests, C=BR"
          export UB_KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/smoke.jks")"
          export UB_KEYSTORE_PASSWORD="SmokePass2026!"
          export UB_KEY_ALIAS="smoke"
          export UB_KEY_PASSWORD="SmokePass2026!"
          bash scripts/build.sh
          rm -f "$RUNNER_TEMP/smoke.jks"
      - name: Publicar AAB de validação
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Build-Smoke-AAB
          path: ${{ runner.temp }}/ub-artifacts/*.aab
          if-no-files-found: error
          retention-days: 7
      - name: Publicar APK de validação
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Build-Smoke-Android
          path: ${{ runner.temp }}/ub-artifacts/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Compilar AAB sem assinatura para assinatura posterior
        env:
          UB_PROJECT_DIR: samples/android-native
          UB_KIND: android
          UB_TARGET: aab-unsigned
          UB_MODULE: app
        run: bash scripts/build.sh
      - name: Publicar AAB unsigned
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Build-Smoke-Unsigned-AAB
          path: ${{ runner.temp }}/ub-artifacts/unsigned.aab
          if-no-files-found: error
          retention-days: 7
      - name: Assinar AAB depois do build sem recompilar
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keyalg RSA -keysize 2048 -validity 7 \
            -alias upload -keystore "$RUNNER_TEMP/postbuild.jks" \
            -storepass 'TemporaryTest2026!' -keypass 'TemporaryTest2026!' \
            -dname 'CN=Universal Build Test, O=Laboratory, C=BR'
          export UB_SOURCE_AAB="$RUNNER_TEMP/ub-artifacts/unsigned.aab"
          export UB_KEYSTORE_BASE64="$(base64 -w0 "$RUNNER_TEMP/postbuild.jks")"
          export UB_KEYSTORE_PASSWORD='TemporaryTest2026!'
          export UB_KEY_ALIAS=upload
          export UB_KEY_PASSWORD='TemporaryTest2026!'
          bash scripts/sign-aab.sh
          rm -f "$RUNNER_TEMP/postbuild.jks"
      - name: Publicar AAB pós-assinatura de laboratório
        uses: actions/upload-artifact@v4
        with:
          name: Universal-Build-Smoke-Post-Sign
          path: ${{ runner.temp }}/signing/release-signed.aab
          if-no-files-found: error
          retention-days: 7
