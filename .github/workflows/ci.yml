name: Universal Build - Verificações
on:
  push:
    branches:
      - main
      - implementation/**
      - feat/**
      - fix/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testar sintaxe dos scripts
        run: |
          set -euo pipefail
          bash -n scripts/detect.sh
          bash -n scripts/build.sh
          bash -n scripts/sign-aab.sh
          bash -n tests/test-detect.sh
          bash -n tests/test-build-flavors.sh
          python3 -m py_compile scripts/extract_zip.py
          node --check dashboard/app.js
          node --check dashboard/android-repos.js
          node --check dashboard/admob-config.js
          node --check dashboard/build-progress.js
          node --check dashboard/artifact-download.js
      - name: Testar filtro de repositórios Android
        run: node --test tests/android-repos.test.cjs tests/test-console-build-config.cjs tests/admob-settings.test.cjs tests/console-live.test.cjs
      - name: Auditar IDs e referências do painel
        run: python3 tests/test-dashboard.py
      - name: Testar identificação de projeto
        run: bash tests/test-detect.sh
      - name: Validar builds por flavor e integração de assinatura
        run: bash tests/test-build-flavors.sh
      - name: Testar extração segura de ZIP
        run: python3 tests/test-zip.py
      - name: Validar arquivos YAML dos workflows
        run: |
          python3 -m pip install --user PyYAML
          python3 tests/check-workflows.py
